# Producción: Caddy (HTTPS automático) -> nginx (dashboard compilado) -> gunicorn (API) -> Postgres.
#
#   cp .env.production.example .env   # y completá los valores (ver DEPLOY.md)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Todo queda en un solo origen: https://DOMAIN/ (dashboard), /api/, /admin/ y el SDK en
# /static/analytics.js. Sólo Caddy publica puertos (80 y 443).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_BEHIND_HTTPS_PROXY: "1"
      TRACKING_TRUST_PROXY_HEADERS: "1" # Caddy -> nginx setean X-Forwarded-For con la IP real
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
               --workers $${GUNICORN_WORKERS:-3} --timeout 60 --access-logfile -"
    volumes:
      - ./deploy/geoip:/geoip:ro # opcional: GeoLite2-Country.mmdb para el país (ver DEPLOY.md)
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Definí DOMAIN en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados: no borrar este volumen
      - caddy_config:/config
    depends_on:
      - web

  # Copia diaria de la base en ./backups (se guardan los últimos BACKUP_KEEP_DAYS días).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-analytics}
      PGUSER: ${POSTGRES_USER:-analytics}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
