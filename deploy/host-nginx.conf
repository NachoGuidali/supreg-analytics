# nginx del servidor (el que ya atiende tus otros sitios) -> SupReg Analytics en 127.0.0.1:8090.
#
#   sudo cp deploy/host-nginx.conf /etc/nginx/sites-available/analytics.supregsolutions.com
#   sudo ln -s /etc/nginx/sites-available/analytics.supregsolutions.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d analytics.supregsolutions.com     # agrega HTTPS y la redirección
#
# Si cambiaste WEB_PORT en .env, cambialo también en proxy_pass.
server {
    listen 80;
    listen [::]:80;
    server_name analytics.supregsolutions.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La IP real del visitante (sólo para el país; nunca se guarda). $remote_addr y no
        # $proxy_add_x_forwarded_for: así nadie puede inventarse otra IP desde el navegador.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
